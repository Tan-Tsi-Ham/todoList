<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList - 任务管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="toast-container" id="toast-container"></div>

    <div class="confirm-modal" id="confirm-modal">
        <div class="confirm-box">
            <div class="confirm-header" id="confirm-header">确认操作</div>
            <div class="confirm-body" id="confirm-body">确定要执行此操作吗？</div>
            <div class="confirm-footer">
                <button class="btn btn-secondary" onclick="closeConfirm(false)">取消</button>
                <button class="btn btn-primary" onclick="closeConfirm(true)">确定</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="exportData()">📤 导出数据</button>
                <button class="btn btn-secondary" onclick="openImportModal()">📥 导入数据</button>
            </div>
            <div class="header-content">
                <h1>📝 任务界面</h1>
                <p>先完成再完美。</p>
                <p>状态不太好的话，尽量能做多少做多少。</p>
                <div class="header-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-total">0</div>
                        <div class="stat-label">总任务</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-pending">0</div>
                        <div class="stat-label">待完成</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-completed">0</div>
                        <div class="stat-label">已完成</div>
                    </div>
                </div>
            </div>
        </div>

        <nav class="nav">
            <button class="nav-tab active" data-page="home">📅 每日任务</button>
            <button class="nav-tab" data-page="groups">📁 近期任务</button>
            <button class="nav-tab" data-page="history">📜 过往任务</button>
        </nav>

        <div class="content">
            <div class="page active" id="page-home">
                <div class="page-header">
                    <div class="date-nav">
                        <button class="btn btn-icon" onclick="changeDate(-1)" title="上一天">◀</button>
                        <input type="date" id="date-picker" class="date-picker-input" onchange="handleDateChange()">
                        <button class="btn btn-icon" onclick="changeDate(1)" title="下一天">▶</button>
                        <button class="btn btn-secondary btn-sm" onclick="resetToToday()">今天</button>
                    </div>
                    <button class="btn btn-primary" onclick="openTaskModal()">
                        ➕ 新建任务
                    </button>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="home-search" placeholder="搜索任务..." oninput="renderHomePage()">
                </div>
                <p class="drag-hint">💡 拖拽任务可调整顺序 | Ctrl+N 新建任务</p>
                <div id="home-tasks"></div>
            </div>

            <div class="page" id="page-groups">
                <div class="page-header">
                    <h2 class="page-title">任务组</h2>
                    <button class="btn btn-primary" onclick="openGroupModal()">
                        ➕ 新建任务组
                    </button>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="groups-search" placeholder="搜索任务组或任务..." oninput="renderGroupsPage()">
                </div>
                <p class="drag-hint">💡 拖拽任务组可调整顺序</p>
                <div id="groups-list"></div>
            </div>

            <div class="page" id="page-history">
                <div class="page-header">
                    <h2 class="page-title">过期任务</h2>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="history-search" placeholder="搜索历史任务..." oninput="renderHistoryPage()">
                </div>
                <div id="history-tasks"></div>
            </div>
        </div>
        <div class="footer">
            <a href="https://github.com/Tan-Tsi-Ham/todoList" target="_blank" rel="noopener noreferrer">📦 点击查看使用方法和简介@Tan-Tsi-Ham</a>
        </div>
    </div>

    <div class="modal-overlay" id="task-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="task-modal-title">新建任务</h3>
                <button class="btn btn-icon" onclick="closeTaskModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="task-form">
                    <div class="form-group">
                        <label class="form-label">标题 *</label>
                        <input type="text" class="form-input" id="task-title" placeholder="请输入任务标题" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述</label>
                        <textarea class="form-input form-textarea" id="task-description" placeholder="请输入任务描述"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">所属任务组 *</label>
                        <select class="form-select" id="task-group" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">任务日期</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="date" class="form-input" id="task-date">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="clearTaskDate()" title="清除日期">清除</button>
                        </div>
                        <div style="font-size: 12px; color: var(--gray-400); margin-top: 4px;">不设置日期则显示在「未安排日期」区域</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">截止时间</label>
                        <input type="datetime-local" class="form-input" id="task-end">
                    </div>
                    <div class="form-group">
                        <label class="form-label">重复周期</label>
                        <div style="display: flex; gap: 16px;">
                            <label class="form-checkbox">
                                <input type="radio" name="task-repeat" value="none" checked onchange="toggleWeeklyDays()">
                                <span>不重复</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="radio" name="task-repeat" value="daily" onchange="toggleWeeklyDays()">
                                <span>每日重复</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="radio" name="task-repeat" value="weekly" onchange="toggleWeeklyDays()">
                                <span>每周重复</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-group" id="weekly-days-group" style="display: none;">
                        <label class="form-label">选择重复的星期（可多选）</label>
                        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-mon" value="1">
                                <span>周一</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-tue" value="2">
                                <span>周二</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-wed" value="3">
                                <span>周三</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-thu" value="4">
                                <span>周四</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-fri" value="5">
                                <span>周五</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-sat" value="6">
                                <span>周六</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-sun" value="0">
                                <span>周日</span>
                            </label>
                        </div>
                    </div>
                    
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeTaskModal()">取消</button>
                <button class="btn btn-primary" onclick="saveTask()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="group-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="group-modal-title">新建任务组</h3>
                <button class="btn btn-icon" onclick="closeGroupModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="group-form">
                    <div class="form-group">
                        <label class="form-label">任务组名称 *</label>
                        <input type="text" class="form-input" id="group-name" placeholder="请输入任务组名称" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">简介</label>
                        <textarea class="form-input form-textarea" id="group-description" placeholder="请输入任务组简介"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeGroupModal()">取消</button>
                <button class="btn btn-primary" onclick="saveGroup()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="import-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">导入数据</h3>
                <button class="btn btn-icon" onclick="closeImportModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">选择 JSON 文件</label>
                    <input type="file" id="import-file" accept=".json" class="form-input" onchange="handleFileSelect(event)">
                </div>
                <div id="import-preview" style="margin-top: 16px;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeImportModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmImport()">确认导入</button>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="storage.js"></script>
    <script src="ui.js"></script>
    <script src="modal.js"></script>
    <script src="render.js"></script>
    <script src="drag.js"></script>
    <script src="app.js"></script>
    <script>
        init();
    </script>
</body>
</html>
