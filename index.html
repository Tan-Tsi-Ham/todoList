<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList - 任务管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --primary-dark: #1e40af;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --success: #16a34a;
            --success-light: #dcfce7;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--gray-800);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 32px 24px;
            text-align: center;
            position: relative;
        }

        .header-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
        }

        .header-actions .btn {
            padding: 8px 16px;
            font-size: 13px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .nav {
            display: flex;
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
        }

        .nav-tab {
            flex: 1;
            padding: 16px 20px;
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: var(--gray-600);
            transition: all 0.2s ease;
            border: none;
            background: transparent;
            position: relative;
        }

        .nav-tab:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .nav-tab.active {
            color: var(--primary);
            background: white;
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }

        .content {
            padding: 24px;
            min-height: 500px;
        }

        .footer {
            padding: 16px 24px;
            text-align: center;
            background: var(--gray-50);
            border-top: 1px solid var(--gray-200);
        }

        .footer a {
            color: var(--gray-500);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
        }

        .btn-danger {
            background: var(--danger-light);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-icon {
            padding: 8px;
            background: transparent;
            color: var(--gray-500);
            border-radius: 8px;
        }

        .btn-icon:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-icon.danger:hover {
            background: var(--danger-light);
            color: var(--danger);
        }

        .btn-icon.home-active {
            background: var(--primary-light);
            color: var(--primary);
        }

        .task-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            cursor: grab;
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--gray-300);
        }

        .task-card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .task-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .task-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--gray-300);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .task-checkbox:hover {
            border-color: var(--primary);
        }

        .task-checkbox.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--gray-800);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: var(--gray-400);
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: var(--gray-500);
        }

        .task-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .task-group-tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        .task-due {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .task-due.overdue {
            color: var(--danger);
        }

        .task-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .task-card:hover .task-actions {
            opacity: 1;
        }

        .group-card {
            background: var(--gray-50);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
            cursor: grab;
        }

        .group-card:hover {
            box-shadow: var(--shadow-md);
        }

        .group-card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .group-card.collapsed {
            padding: 16px 20px;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .group-card.collapsed .group-header {
            margin-bottom: 0;
        }

        .group-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .collapse-icon {
            font-size: 12px;
            transition: transform 0.2s ease;
            color: var(--gray-400);
        }

        .group-card.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        .group-header h3 {
            margin: 0;
        }

        .group-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .group-actions {
            display: flex;
            gap: 4px;
        }

        .group-card.collapsed .group-actions,
        .group-card.collapsed .group-tasks {
            display: none;
        }

        .group-tasks {
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-500);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 15px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.2s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1px solid var(--gray-300);
            border-radius: 10px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1px solid var(--gray-300);
            border-radius: 10px;
            font-family: inherit;
            background: white;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .form-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-checkbox span {
            font-size: 14px;
            color: var(--gray-700);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .drag-hint {
            text-align: center;
            font-size: 12px;
            color: var(--gray-400);
            margin-bottom: 16px;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 20px 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }

            .header-actions {
                position: static;
                order: 1;
            }

            .header-actions .btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .header-content {
                order: 2;
                text-align: center;
            }

            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 16px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .task-actions {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="exportData()">📤 导出数据</button>
                <button class="btn btn-secondary" onclick="openImportModal()">📥 导入数据</button>
            </div>
            <div class="header-content">
                <h1>📝 任务界面</h1>
                <p>先完成再完美。</p>
                <p>状态不太好的话，尽量能做多少做多少。</p>
            </div>
        </div>

        <nav class="nav">
            <button class="nav-tab active" data-page="home">🏠 今日任务</button>
            <button class="nav-tab" data-page="groups">📁 近期任务</button>
            <button class="nav-tab" data-page="history">📜 过往任务</button>
        </nav>

        <div class="content">
            <div class="page active" id="page-home">
                <div class="page-header">
                    <h2 class="page-title">今日任务</h2>
                    <button class="btn btn-primary" onclick="openTaskModal()">
                        ➕ 新建任务
                    </button>
                </div>
                <p class="drag-hint">💡 拖拽任务可调整顺序</p>
                <div id="home-tasks"></div>
            </div>

            <div class="page" id="page-groups">
                <div class="page-header">
                    <h2 class="page-title">任务组</h2>
                    <button class="btn btn-primary" onclick="openGroupModal()">
                        ➕ 新建任务组
                    </button>
                </div>
                <p class="drag-hint">💡 拖拽任务组可调整顺序</p>
                <div id="groups-list"></div>
            </div>

            <div class="page" id="page-history">
                <div class="page-header">
                    <h2 class="page-title">过期任务</h2>
                </div>
                <div id="history-tasks"></div>
            </div>
        </div>
        <div class="footer">
            <a href="https://github.com/Tan-Tsi-Ham/todoList" target="_blank" rel="noopener noreferrer">📦 点击查看使用方法和简介@Tan-Tsi-Ham</a>
        </div>
    </div>

    <div class="modal-overlay" id="task-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="task-modal-title">新建任务</h3>
                <button class="btn btn-icon" onclick="closeTaskModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="task-form">
                    <div class="form-group">
                        <label class="form-label">标题 *</label>
                        <input type="text" class="form-input" id="task-title" placeholder="请输入任务标题" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述</label>
                        <textarea class="form-input form-textarea" id="task-description" placeholder="请输入任务描述"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">所属任务组 *</label>
                        <select class="form-select" id="task-group" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">截止时间</label>
                        <input type="datetime-local" class="form-input" id="task-end">
                    </div>
                    <div class="form-group">
                        <label class="form-label">重复周期</label>
                        <div style="display: flex; gap: 16px;">
                            <label class="form-checkbox">
                                <input type="radio" name="task-repeat" value="none" checked onchange="toggleWeeklyDays()">
                                <span>不重复</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="radio" name="task-repeat" value="daily" onchange="toggleWeeklyDays()">
                                <span>每日重复</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="radio" name="task-repeat" value="weekly" onchange="toggleWeeklyDays()">
                                <span>每周重复</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-group" id="weekly-days-group" style="display: none;">
                        <label class="form-label">选择重复的星期（可多选）</label>
                        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-mon" value="1">
                                <span>周一</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-tue" value="2">
                                <span>周二</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-wed" value="3">
                                <span>周三</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-thu" value="4">
                                <span>周四</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-fri" value="5">
                                <span>周五</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-sat" value="6">
                                <span>周六</span>
                            </label>
                            <label class="form-checkbox">
                                <input type="checkbox" id="task-repeat-sun" value="0">
                                <span>周日</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-checkbox">
                            <input type="checkbox" id="task-show-home" checked>
                            <span>在主界面显示</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="form-checkbox">
                            <input type="checkbox" id="task-depends">
                            <span>上一个任务完成后才开始</span>
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeTaskModal()">取消</button>
                <button class="btn btn-primary" onclick="saveTask()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="group-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="group-modal-title">新建任务组</h3>
                <button class="btn btn-icon" onclick="closeGroupModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="group-form">
                    <div class="form-group">
                        <label class="form-label">任务组名称 *</label>
                        <input type="text" class="form-input" id="group-name" placeholder="请输入任务组名称" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeGroupModal()">取消</button>
                <button class="btn btn-primary" onclick="saveGroup()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="import-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">导入数据</h3>
                <button class="btn btn-icon" onclick="closeImportModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">选择 JSON 文件</label>
                    <input type="file" id="import-file" accept=".json" class="form-input" onchange="handleFileSelect(event)">
                </div>
                <div id="import-preview" style="margin-top: 16px;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeImportModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmImport()">确认导入</button>
            </div>
        </div>
    </div>

    <script>
        let taskGroups = [];
        let tasks = [];
        let editingTaskId = null;
        let editingGroupId = null;
        let draggedItem = null;
        let pendingImportData = null;

        function init() {
            loadData();
            if (taskGroups.length === 0) {
                taskGroups = [
                    { id: generateId(), name: '工作', order: 0, createdAt: new Date().toISOString(), collapsed: true, movedToHistory: false },
                    { id: generateId(), name: '生活', order: 1, createdAt: new Date().toISOString(), collapsed: true, movedToHistory: false },
                    { id: generateId(), name: '学习', order: 2, createdAt: new Date().toISOString(), collapsed: true, movedToHistory: false }
                ];
                saveData();
            }
            checkDailyRefresh();
            render();
            setupNavigation();
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function loadData() {
            const savedGroups = localStorage.getItem('taskGroups');
            const savedTasks = localStorage.getItem('tasks');
            if (savedGroups) taskGroups = JSON.parse(savedGroups);
            if (savedTasks) tasks = JSON.parse(savedTasks);
        }

        function saveData() {
            localStorage.setItem('taskGroups', JSON.stringify(taskGroups));
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function exportData() {
            const data = {
                version: '1.0',
                exportTime: new Date().toISOString(),
                taskGroups: taskGroups,
                tasks: tasks
            };
            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const timestamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `todolist-backup-${timestamp}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function openImportModal() {
            pendingImportData = null;
            document.getElementById('import-file').value = '';
            document.getElementById('import-preview').innerHTML = '';
            document.getElementById('import-modal').classList.add('active');
        }

        function closeImportModal() {
            document.getElementById('import-modal').classList.remove('active');
            pendingImportData = null;
            document.getElementById('import-file').value = '';
            document.getElementById('import-preview').innerHTML = '';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.taskGroups || !data.tasks) {
                        alert('文件格式不正确，缺少必要的数据字段');
                        return;
                    }
                    pendingImportData = data;
                    const preview = document.getElementById('import-preview');
                    preview.innerHTML = `
                        <div style="background: var(--gray-50); padding: 16px; border-radius: 10px;">
                            <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">数据预览：</div>
                            <div style="font-size: 13px; color: var(--gray-600);">
                                <div>📁 任务组：${data.taskGroups.length} 个</div>
                                <div>📝 任务：${data.tasks.length} 个</div>
                                ${data.exportTime ? `<div style="margin-top: 4px; font-size: 12px; color: var(--gray-400);">导出时间：${new Date(data.exportTime).toLocaleString()}</div>` : ''}
                            </div>
                        </div>
                    `;
                } catch (err) {
                    alert('文件解析失败，请确保是有效的 JSON 文件');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function confirmImport() {
            if (!pendingImportData) {
                alert('请先选择一个有效的备份文件');
                return;
            }
            if (!confirm(`确定要导入数据吗？这将覆盖当前所有数据。\n\n将导入：\n- ${pendingImportData.taskGroups.length} 个任务组\n- ${pendingImportData.tasks.length} 个任务`)) {
                return;
            }
            taskGroups = pendingImportData.taskGroups;
            tasks = pendingImportData.tasks;
            saveData();
            closeImportModal();
            render();
            alert('数据导入成功！');
        }

        function checkDailyRefresh() {
            const today = new Date();
            const todayStr = today.toDateString();
            const lastRefresh = localStorage.getItem('lastDailyRefresh');
            const dayOfWeek = today.getDay();
            const dayMap = { 0: 'sun', 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thu', 5: 'fri', 6: 'sat' };
            const currentDayKey = dayMap[dayOfWeek];
            
            if (lastRefresh !== todayStr) {
                tasks.forEach(task => {
                    const repeatType = task.repeatType || (task.dailyRefresh ? 'daily' : 'none');
                    if (repeatType === 'daily' && task.completed) {
                        task.completed = false;
                    }
                });
                saveData();
                localStorage.setItem('lastDailyRefresh', todayStr);
            }

            const lastWeeklyRefresh = localStorage.getItem('lastWeeklyRefresh');
            const todayWeeklyKey = todayStr + '-' + currentDayKey;
            
            if (lastWeeklyRefresh !== todayWeeklyKey) {
                tasks.forEach(task => {
                    const repeatType = task.repeatType || (task.dailyRefresh ? 'daily' : 'none');
                    if (repeatType === 'weekly' && task.completed) {
                        const repeatDays = task.repeatDays || ['mon'];
                        if (repeatDays.includes(currentDayKey)) {
                            task.completed = false;
                        }
                    }
                });
                saveData();
                localStorage.setItem('lastWeeklyRefresh', todayWeeklyKey);
            }
        }

        function setupNavigation() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const page = tab.dataset.page;
                    switchPage(page);
                });
            });
        }

        function switchPage(page) {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.page === page);
            });
            document.querySelectorAll('.page').forEach(p => {
                p.classList.toggle('active', p.id === `page-${page}`);
            });
            render();
        }

        function render() {
            renderHomePage();
            renderGroupsPage();
            renderHistoryPage();
        }

        function renderHomePage() {
            const container = document.getElementById('home-tasks');
            const todayTasks = tasks
                .filter(t => t.showOnHome && !t.movedToHistory)
                .sort((a, b) => a.order - b.order);

            if (todayTasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎉</div>
                        <div class="empty-state-text">今天还没有任务，快添加一个吧！</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = todayTasks.map(task => renderTaskCard(task)).join('');
            setupTaskDrag(container);
        }

        function renderTaskCard(task) {
            const group = taskGroups.find(g => g.id === task.groupId);
            const isOverdue = task.endTime && new Date(task.endTime) < new Date() && !task.completed;
            const canStart = checkCanStart(task);

            return `
                <div class="task-card ${task.completed ? 'completed' : ''} ${!canStart ? 'opacity-60' : ''}" 
                     data-task-id="${task.id}" draggable="true">
                    <div class="task-header">
                        <div class="task-checkbox ${task.completed ? 'checked' : ''}" 
                             onclick="toggleTask('${task.id}')"></div>
                        <div class="task-content">
                            <div class="task-title">${escapeHtml(task.title)}</div>
                            <div class="task-meta">
                                <span class="task-meta-item">
                                    <span class="task-group-tag">${escapeHtml(group?.name || '未分组')}</span>
                                </span>
                                ${task.endTime ? `
                                    <span class="task-due ${isOverdue ? 'overdue' : ''}">
                                        ⏰ ${formatDateTime(task.endTime)}
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="btn btn-icon" onclick="openTaskModal('${task.id}')">✏️</button>
                            <button class="btn btn-icon ${task.showOnHome ? 'home-active' : ''}" 
                                    onclick="toggleShowOnHome('${task.id}')" 
                                    title="${task.showOnHome ? '从今日任务隐藏' : '在今日任务显示'}">
                                🏠
                            </button>
                            ${task.completed ? `<button class="btn btn-icon" onclick="moveToHistory('${task.id}')" title="移入历史">📜</button>` : ''}
                            <button class="btn btn-icon danger" onclick="deleteTask('${task.id}')">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function checkCanStart(task) {
            if (!task.dependsOnPrev) return true;
            const groupTasks = tasks
                .filter(t => t.groupId === task.groupId)
                .sort((a, b) => a.order - b.order);
            const taskIndex = groupTasks.findIndex(t => t.id === task.id);
            if (taskIndex <= 0) return true;
            return groupTasks[taskIndex - 1].completed;
        }

        function toggleGroupCollapse(groupId) {
            if (draggedItem) return;
            const group = taskGroups.find(g => g.id === groupId);
            if (group) {
                group.collapsed = !group.collapsed;
                saveData();
                renderGroupsPage();
                const container = document.getElementById('groups-list');
                container.querySelectorAll('.group-tasks').forEach(el => {
                    setupTaskDrag(el);
                });
            }
        }

        function renderGroupsPage() {
            const container = document.getElementById('groups-list');
            const sortedGroups = [...taskGroups]
                .filter(group => !group.movedToHistory)
                .sort((a, b) => a.order - b.order);

            if (sortedGroups.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📁</div>
                        <div class="empty-state-text">还没有任务组，快创建一个吧！</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = sortedGroups.map(group => {
                const groupTasks = tasks
                    .filter(t => t.groupId === group.id && !t.movedToHistory)
                    .sort((a, b) => a.order - b.order);
                const isCollapsed = group.collapsed !== false;
                const completedCount = groupTasks.filter(t => t.completed).length;
                return `
                    <div class="group-card ${isCollapsed ? 'collapsed' : ''}" data-group-id="${group.id}" draggable="true">
                        <div class="group-header" onclick="toggleGroupCollapse('${group.id}')">
                            <div class="group-title-wrapper">
                                <span class="collapse-icon">▼</span>
                                <h3 class="group-title">${escapeHtml(group.name)}</h3>
                                <span style="font-size: 12px; color: var(--gray-400); margin-left: 8px;">
                                    (${completedCount}/${groupTasks.length})
                                </span>
                            </div>
                            <div class="group-actions" onclick="event.stopPropagation()">
                                <button class="btn btn-primary" onclick="openTaskModal(null, '${group.id}')">➕</button>
                                <button class="btn btn-icon" onclick="openGroupModal('${group.id}')">✏️</button>
                                <button class="btn btn-icon" onclick="moveGroupToHistory('${group.id}')" title="移入历史">📜</button>
                                <button class="btn btn-icon danger" onclick="deleteGroup('${group.id}')">🗑️</button>
                            </div>
                        </div>
                        <div class="group-tasks" data-group-id="${group.id}">
                            ${groupTasks.length === 0 ? `
                                <div class="empty-state" style="padding: 30px 20px;">
                                    <div class="empty-state-text">该组暂无任务</div>
                                </div>
                            ` : groupTasks.map(task => renderTaskCard(task)).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            setupGroupDrag(container);
            container.querySelectorAll('.group-tasks').forEach(el => {
                setupTaskDrag(el);
            });
        }

        function renderHistoryPage() {
            const container = document.getElementById('history-tasks');
            const now = new Date();
            const historyTasks = tasks
                .filter(t => {
                    const group = t.groupId ? taskGroups.find(g => g.id === t.groupId) : null;
                    return (t.endTime && new Date(t.endTime) < now && !t.completed) || 
                           t.movedToHistory || 
                           (group && group.movedToHistory);
                });

            if (historyTasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✨</div>
                        <div class="empty-state-text">没有历史任务，做得很好！</div>
                    </div>
                `;
                return;
            }

            const movedGroups = taskGroups.filter(g => g.movedToHistory);
            const tasksByGroup = {};
            
            movedGroups.forEach(group => {
                const groupTasks = tasks.filter(t => t.groupId === group.id);
                if (groupTasks.length > 0) {
                    tasksByGroup[group.id] = groupTasks;
                }
            });

            historyTasks.forEach(task => {
                if (!task.groupId || !taskGroups.find(g => g.id === task.groupId)?.movedToHistory) {
                    const groupId = task.groupId || 'ungrouped';
                    if (!tasksByGroup[groupId]) {
                        tasksByGroup[groupId] = [];
                    }
                    if (!tasksByGroup[groupId].find(t => t.id === task.id)) {
                        tasksByGroup[groupId].push(task);
                    }
                }
            });

            const groupIds = Object.keys(tasksByGroup).sort((a, b) => {
                if (a === 'ungrouped') return 1;
                if (b === 'ungrouped') return -1;
                const groupA = taskGroups.find(g => g.id === a);
                const groupB = taskGroups.find(g => g.id === b);
                return (groupA?.order || 0) - (groupB?.order || 0);
            });

            container.innerHTML = groupIds.map(groupId => {
                const group = groupId === 'ungrouped' ? null : taskGroups.find(g => g.id === groupId);
                const groupTasks = tasksByGroup[groupId].sort((a, b) => new Date(b.endTime || b.createdAt) - new Date(a.endTime || a.createdAt));
                const completedCount = groupTasks.filter(t => t.completed).length;
                return `
                    <div class="group-card collapsed" data-group-id="${groupId}">
                        <div class="group-header" onclick="toggleHistoryGroupCollapse('${groupId}')">
                            <div class="group-title-wrapper">
                                <span class="collapse-icon">▼</span>
                                <h3 class="group-title">${escapeHtml(group?.name || '未分组')}</h3>
                                <span style="font-size: 12px; color: var(--gray-400); margin-left: 8px;">
                                    (${completedCount}/${groupTasks.length})
                                </span>
                            </div>
                            <div class="group-actions" onclick="event.stopPropagation()">
                                <button class="btn btn-primary" onclick="moveGroupOutOfHistory('${groupId}')" title="移出历史">↩️</button>
                            </div>
                        </div>
                        <div class="group-tasks" data-group-id="${groupId}">
                            ${groupTasks.map(task => `
                                <div class="task-card ${task.completed ? 'completed' : ''}" data-task-id="${task.id}">
                                    <div class="task-header">
                                        <div class="task-checkbox ${task.completed ? 'checked' : ''}" 
                                             onclick="toggleTask('${task.id}')"></div>
                                        <div class="task-content">
                                            <div class="task-title">${escapeHtml(task.title)}</div>
                                            <div class="task-meta">
                                                ${task.endTime ? `
                                                    <span class="task-due">
                                                        ⏰ ${formatDateTime(task.endTime)}
                                                    </span>
                                                ` : ''}
                                                ${task.completed && task.movedToHistory ? `
                                                    <span class="task-meta-item">📜 已移入历史</span>
                                                ` : ''}
                                            </div>
                                        </div>
                                        <div class="task-actions">
                                            <button class="btn btn-icon" onclick="openTaskModal('${task.id}')">✏️</button>
                                            <button class="btn btn-icon" onclick="moveOutOfHistory('${task.id}')" title="移出历史">↩️</button>
                                            <button class="btn btn-icon danger" onclick="deleteTask('${task.id}')">🗑️</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleHistoryGroupCollapse(groupId) {
            const container = document.getElementById('history-tasks');
            const groupCard = container.querySelector(`.group-card[data-group-id="${groupId}"]`);
            if (groupCard) {
                groupCard.classList.toggle('collapsed');
            }
        }

        function setupTaskDrag(container) {
            const taskCards = container.querySelectorAll('.task-card');
            taskCards.forEach(card => {
                card.addEventListener('dragstart', handleTaskDragStart);
                card.addEventListener('dragend', handleTaskDragEnd);
                card.addEventListener('dragover', handleTaskDragOver);
                card.addEventListener('drop', handleTaskDrop);
            });
        }

        function setupGroupDrag(container) {
            const groupCards = container.querySelectorAll('.group-card');
            groupCards.forEach(card => {
                card.addEventListener('dragstart', handleGroupDragStart);
                card.addEventListener('dragend', handleGroupDragEnd);
                card.addEventListener('dragover', handleGroupDragOver);
                card.addEventListener('drop', handleGroupDrop);
            });
        }

        function handleTaskDragStart(e) {
            draggedItem = e.target.closest('.task-card');
            draggedItem.classList.add('dragging');
        }

        function handleTaskDragEnd(e) {
            draggedItem.classList.remove('dragging');
            draggedItem = null;
        }

        function handleTaskDragOver(e) {
            e.preventDefault();
            const card = e.target.closest('.task-card');
            if (card && card !== draggedItem) {
                const container = draggedItem.parentElement;
                const cards = [...container.querySelectorAll('.task-card')];
                const draggedIdx = cards.indexOf(draggedItem);
                const targetIdx = cards.indexOf(card);
                if (draggedIdx < targetIdx) {
                    card.after(draggedItem);
                } else {
                    card.before(draggedItem);
                }
                updateTaskOrder(container);
            }
        }

        function handleTaskDrop(e) {
            e.preventDefault();
            const container = draggedItem.parentElement;
            updateTaskOrder(container);
        }

        function updateTaskOrder(container) {
            const cards = [...container.querySelectorAll('.task-card')];
            const groupId = container.dataset.groupId;
            cards.forEach((card, idx) => {
                const taskId = card.dataset.taskId;
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    if (groupId) {
                        const groupTasks = tasks.filter(t => t.groupId === groupId);
                        task.order = idx;
                    } else {
                        task.order = idx;
                    }
                }
            });
            saveData();
        }

        function handleGroupDragStart(e) {
            draggedItem = e.target.closest('.group-card');
            draggedItem.classList.add('dragging');
        }

        function handleGroupDragEnd(e) {
            draggedItem.classList.remove('dragging');
            draggedItem = null;
        }

        function handleGroupDragOver(e) {
            e.preventDefault();
            const card = e.target.closest('.group-card');
            if (card && card !== draggedItem) {
                const container = document.getElementById('groups-list');
                const cards = [...container.querySelectorAll('.group-card')];
                const draggedIdx = cards.indexOf(draggedItem);
                const targetIdx = cards.indexOf(card);
                if (draggedIdx < targetIdx) {
                    card.after(draggedItem);
                } else {
                    card.before(draggedItem);
                }
            }
        }

        function handleGroupDrop(e) {
            e.preventDefault();
            const container = document.getElementById('groups-list');
            const cards = [...container.querySelectorAll('.group-card')];
            cards.forEach((card, idx) => {
                const groupId = card.dataset.groupId;
                const group = taskGroups.find(g => g.id === groupId);
                if (group) {
                    group.order = idx;
                }
            });
            saveData();
            render();
        }

        function toggleWeeklyDays() {
            const repeatType = document.querySelector('input[name="task-repeat"]:checked').value;
            const weeklyDaysGroup = document.getElementById('weekly-days-group');
            weeklyDaysGroup.style.display = repeatType === 'weekly' ? 'block' : 'none';
        }

        function openTaskModal(taskId = null, groupId = null) {
            editingTaskId = taskId;
            const modal = document.getElementById('task-modal');
            const title = document.getElementById('task-modal-title');
            const groupSelect = document.getElementById('task-group');
            groupSelect.innerHTML = taskGroups
                .sort((a, b) => a.order - b.order)
                .map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`)
                .join('');

            const dayCheckboxes = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            dayCheckboxes.forEach(day => {
                document.getElementById(`task-repeat-${day}`).checked = false;
            });

            if (taskId) {
                title.textContent = '编辑任务';
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    document.getElementById('task-title').value = task.title;
                    document.getElementById('task-description').value = task.description || '';
                    document.getElementById('task-group').value = task.groupId;
                    document.getElementById('task-end').value = task.endTime ? formatLocalDateTime(task.endTime) : '';
                    const repeatType = task.repeatType || (task.dailyRefresh ? 'daily' : 'none');
                    document.querySelector(`input[name="task-repeat"][value="${repeatType}"]`).checked = true;
                    if (task.repeatDays && Array.isArray(task.repeatDays)) {
                        task.repeatDays.forEach(day => {
                            const checkbox = document.getElementById(`task-repeat-${day}`);
                            if (checkbox) checkbox.checked = true;
                        });
                    }
                    document.getElementById('task-show-home').checked = task.showOnHome;
                    document.getElementById('task-depends').checked = task.dependsOnPrev;
                }
            } else {
                title.textContent = '新建任务';
                document.getElementById('task-form').reset();
                document.getElementById('task-show-home').checked = true;
                document.querySelector('input[name="task-repeat"][value="none"]').checked = true;
                if (groupId) {
                    document.getElementById('task-group').value = groupId;
                }
            }
            toggleWeeklyDays();
            modal.classList.add('active');
        }

        function closeTaskModal() {
            document.getElementById('task-modal').classList.remove('active');
            editingTaskId = null;
        }

        function saveTask() {
            const title = document.getElementById('task-title').value.trim();
            const description = document.getElementById('task-description').value.trim();
            const groupId = document.getElementById('task-group').value;
            const endTime = document.getElementById('task-end').value;
            const repeatType = document.querySelector('input[name="task-repeat"]:checked').value;
            const showOnHome = document.getElementById('task-show-home').checked;
            const dependsOnPrev = document.getElementById('task-depends').checked;

            let repeatDays = [];
            if (repeatType === 'weekly') {
                const dayCheckboxes = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
                dayCheckboxes.forEach(day => {
                    if (document.getElementById(`task-repeat-${day}`).checked) {
                        repeatDays.push(day);
                    }
                });
                if (repeatDays.length === 0) {
                    alert('请至少选择一个重复的星期');
                    return;
                }
            }

            if (!title || !groupId) {
                alert('请填写必填项');
                return;
            }

            if (editingTaskId) {
                const task = tasks.find(t => t.id === editingTaskId);
                if (task) {
                    task.title = title;
                    task.description = description;
                    task.groupId = groupId;
                    task.endTime = endTime ? new Date(endTime).toISOString() : null;
                    task.repeatType = repeatType;
                    task.repeatDays = repeatDays.length > 0 ? repeatDays : undefined;
                    delete task.dailyRefresh;
                    task.showOnHome = showOnHome;
                    task.dependsOnPrev = dependsOnPrev;
                }
            } else {
                const maxOrder = Math.max(...tasks.map(t => t.order), -1);
                tasks.push({
                    id: generateId(),
                    title,
                    description,
                    groupId,
                    endTime: endTime ? new Date(endTime).toISOString() : null,
                    repeatType,
                    repeatDays: repeatDays.length > 0 ? repeatDays : undefined,
                    showOnHome,
                    dependsOnPrev,
                    completed: false,
                    order: maxOrder + 1,
                    createdAt: new Date().toISOString()
                });
            }

            saveData();
            closeTaskModal();
            render();
        }

        function toggleTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                if (!task.completed && !checkCanStart(task)) {
                    alert('上一个任务尚未完成，无法完成此任务');
                    return;
                }
                task.completed = !task.completed;
                if (!task.completed && task.movedToHistory) {
                    task.movedToHistory = false;
                }
                saveData();
                render();
            }
        }

        function toggleShowOnHome(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.showOnHome = !task.showOnHome;
                saveData();
                render();
            }
        }

        function moveToHistory(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.movedToHistory = true;
                saveData();
                render();
            }
        }

        function moveGroupToHistory(groupId) {
            if (confirm('确定要将这个任务组移入历史吗？')) {
                const group = taskGroups.find(g => g.id === groupId);
                if (group) {
                    group.movedToHistory = true;
                    tasks.forEach(task => {
                        if (task.groupId === groupId) {
                            task.movedToHistory = true;
                        }
                    });
                    saveData();
                    render();
                }
            }
        }

        function moveOutOfHistory(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task && task.groupId) {
                const group = taskGroups.find(g => g.id === task.groupId);
                if (group && group.movedToHistory) {
                    if (confirm('该任务属于已移入历史的任务组，确定要将整个任务组移出历史吗？')) {
                        moveGroupOutOfHistory(task.groupId);
                    }
                    return;
                }
            }
            if (task) {
                task.movedToHistory = false;
                saveData();
                render();
            }
        }

        function moveGroupOutOfHistory(groupId) {
            const group = taskGroups.find(g => g.id === groupId);
            if (group) {
                group.movedToHistory = false;
            }
            tasks.forEach(task => {
                if (task.groupId === groupId) {
                    task.movedToHistory = false;
                }
            });
            saveData();
            render();
        }

        function deleteTask(taskId) {
            if (confirm('确定要删除这个任务吗？')) {
                tasks = tasks.filter(t => t.id !== taskId);
                saveData();
                render();
            }
        }

        function openGroupModal(groupId = null) {
            editingGroupId = groupId;
            const modal = document.getElementById('group-modal');
            const title = document.getElementById('group-modal-title');

            if (groupId) {
                title.textContent = '编辑任务组';
                const group = taskGroups.find(g => g.id === groupId);
                if (group) {
                    document.getElementById('group-name').value = group.name;
                }
            } else {
                title.textContent = '新建任务组';
                document.getElementById('group-form').reset();
            }
            modal.classList.add('active');
        }

        function closeGroupModal() {
            document.getElementById('group-modal').classList.remove('active');
            editingGroupId = null;
        }

        function saveGroup() {
            const name = document.getElementById('group-name').value.trim();
            if (!name) {
                alert('请输入任务组名称');
                return;
            }

            if (editingGroupId) {
                const group = taskGroups.find(g => g.id === editingGroupId);
                if (group) {
                    group.name = name;
                }
            } else {
                const maxOrder = Math.max(...taskGroups.map(g => g.order), -1);
                taskGroups.push({
                    id: generateId(),
                    name,
                    order: maxOrder + 1,
                    createdAt: new Date().toISOString(),
                    collapsed: true,
                    movedToHistory: false
                });
            }

            saveData();
            closeGroupModal();
            render();
        }

        function deleteGroup(groupId) {
            const hasTasks = tasks.some(t => t.groupId === groupId);
            if (hasTasks) {
                if (!confirm('该任务组下还有任务，确定要删除任务组及其所有任务吗？')) {
                    return;
                }
                tasks = tasks.filter(t => t.groupId !== groupId);
            } else {
                if (!confirm('确定要删除这个任务组吗？')) {
                    return;
                }
            }
            taskGroups = taskGroups.filter(g => g.id !== groupId);
            saveData();
            render();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDateTime(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();
            const isTomorrow = new Date(now.getTime() + 86400000).toDateString() === date.toDateString();
            
            let dateStr;
            if (isToday) {
                dateStr = '今天';
            } else if (isTomorrow) {
                dateStr = '明天';
            } else {
                dateStr = `${date.getMonth() + 1}月${date.getDate()}日`;
            }
            
            const timeStr = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            return `${dateStr} ${timeStr}`;
        }

        function formatLocalDateTime(isoString) {
            const date = new Date(isoString);
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        init();
    </script>
</body>
</html>
